name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs prek; the default extra-args (--all-files) find no config here,
      # so the tests below are what actually exercise the hooks.
      - uses: j178/prek-action@af4d4fcb6922b8e6f65c0426947125fcc38794ce # v3.0.2
        with:
          prek-version: "0.5.6"
          extra-args: --version
      - name: Fixture tests
        run: tests/run.sh

  # Single required check (the shared default-branch ruleset requires a passing
  # workflow-summary).
  workflow-summary:
    if: ${{ always() }}
    needs: [test]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
