name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Task (version pinned in Taskfile.yml)
        run: |
          version="$(sed -n 's/^  TASK_VERSION: *//p' Taskfile.yml)"
          go install "github.com/go-task/task/v3/cmd/task@v${version}"
      - run: task check

  # Single required check (the shared default-branch ruleset requires a passing
  # workflow-summary).
  workflow-summary:
    if: ${{ always() }}
    needs: [test]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
