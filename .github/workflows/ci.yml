name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    # A cold ./bin cache builds every Go tool from source; warm runs take a
    # couple of minutes.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup-go
        with:
          go-version-file: go.mod
      - name: Install Task (version pinned in Taskfile.yml)
        run: |
          version="$(sed -n 's/^  TASK_VERSION: *//p' Taskfile.yml)"
          go install "github.com/go-task/task/v3/cmd/task@v${version}"
      # The Go tools are built from source into ./bin (see Taskfile.yml).
      # Restoring ./bin lets Task's status check in go-install see the right
      # module version and Go toolchain and skip the build. A bumped pin in
      # Taskfile.yml, go.mod or the Go version changes the key and rebuilds.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: bin
          key: tools-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.mod', 'Taskfile.yml') }}
      # Same prek as `task setup` installs locally.
      - name: Read the prek version pinned in Taskfile.yml
        id: prek
        run: |
          echo "version=$(sed -n 's/^  PREK_VERSION: *//p' Taskfile.yml)" >> "$GITHUB_OUTPUT"
      # Every hook in .pre-commit-config.yaml, exactly as it runs locally: file
      # hygiene, zizmor, golangci-lint, this repo's own hooks on its workflows,
      # the manifest check, tests with the coverage gate, go mod tidy,
      # govulncheck, and go-licenses. The token turns on zizmor's online audits.
      - name: Run prek hooks
        uses: j178/prek-action@af4d4fcb6922b8e6f65c0426947125fcc38794ce # v3.0.2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          prek-version: ${{ steps.prek.outputs.version }}

  # Single required check (the shared default-branch ruleset requires a passing
  # workflow-summary).
  workflow-summary:
    if: ${{ always() }}
    needs: [checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}

  # Releases from main when the Conventional Commits since the last tag call for
  # it: a fix is a patch, a feat a minor, a breaking change (`!` or
  # BREAKING CHANGE) a major. Anything else (docs, ci, chore, ...) releases
  # nothing. Notes are generated from the merged PR titles.
  release:
    if: ${{ github.event_name == 'push' }}
    needs: [checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # create the release and its tag
    # One at a time, so two quick merges cannot both claim the same version.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # svu reads every commit since the last tag.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A release job must not restore a cache a PR run could have written.
          cache: false
      - name: Install Task (version pinned in Taskfile.yml)
        run: |
          version="$(sed -n 's/^  TASK_VERSION: *//p' Taskfile.yml)"
          go install "github.com/go-task/task/v3/cmd/task@v${version}"
      - name: Release if the commits since the last tag call for one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          next="$(task --silent next-version)"
          if [ -z "$next" ]; then
            echo "No release: nothing since the last tag is a fix, feat, or breaking change."
            exit 0
          fi
          gh release create "$next" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$next" --generate-notes
