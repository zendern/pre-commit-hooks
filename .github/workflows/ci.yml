name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shellcheck the hooks
        run: shellcheck hooks/*.sh tests/*.sh
      - name: Fixture tests
        run: tests/run.sh
      # Dogfood: this repo's own workflows must pass the hook too.
      - name: Run no-latest-runners on this repo
        run: hooks/no-latest-runners.sh .github/workflows/*.yml

  # Single required check (the shared default-branch ruleset requires a passing
  # workflow-summary).
  workflow-summary:
    if: ${{ always() }}
    needs: [test]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
