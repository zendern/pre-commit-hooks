- id: no-latest-runners
  name: pin runners (no *-latest)
  description: Pin GitHub Actions runner labels to a version (e.g. ubuntu-24.04) instead of *-latest.
  entry: no-latest-runners
  language: golang
  verbose: true # a passing hook's warnings are hidden otherwise
  files: ^\.github/workflows/.*\.ya?ml$
- id: require-timeouts
  name: require timeout-minutes on jobs
  description: Require timeout-minutes on GitHub Actions jobs (and, with --steps, on steps) so a hung run doesn't hold a runner for GitHub's 6-hour default.
  entry: require-timeouts
  language: golang
  verbose: true # a passing hook's warnings are hidden otherwise
  files: ^\.github/workflows/.*\.ya?ml$
- id: require-runner-arch
  name: require a runner architecture
  description: Fail on GitHub Actions jobs that run on the wrong CPU architecture. Pass --arch=arm64 or --arch=x64.
  entry: require-runner-arch
  language: golang
  verbose: true # a passing hook's warnings are hidden otherwise
  files: ^\.github/workflows/.*\.ya?ml$
# gh-actions-lock is a Go module, so prek and pre-commit build it with `go
# install` at the pinned version (the Go checksum database rejects a moved
# tag). renovate.json bumps it through the `# renovate:` comment.
- id: gh-actions-lock-verify-local
  name: workflow lockfile coverage
  description: Offline check that every action in .github/workflows/ has an entry in .github/workflows/actions.lock. Regenerate the lockfile with `gh actions-lock`.
  entry: gh-actions-lock --verify-local
  language: golang
  additional_dependencies:
    # renovate: datasource=go depName=github.com/github/gh-actions-lock
    - github.com/github/gh-actions-lock/cmd/gh-actions-lock@v0.4.1
  # Workflows, the lockfile, and in-repo actions reached through `$/`.
  files: (^\.github/workflows/|(^|/)action\.ya?ml$)
  pass_filenames: false
- id: gh-actions-lock-verify
  name: workflow lockfile provenance
  description: Check .github/workflows/actions.lock against GitHub, as the runner does. Needs GH_TOKEN. Manual stage, so commits stay offline; CI runs `prek run --hook-stage manual gh-actions-lock-verify --all-files`.
  entry: gh-actions-lock --verify
  language: golang
  additional_dependencies:
    # renovate: datasource=go depName=github.com/github/gh-actions-lock
    - github.com/github/gh-actions-lock/cmd/gh-actions-lock@v0.4.1
  stages: [manual]
  always_run: true
  pass_filenames: false
