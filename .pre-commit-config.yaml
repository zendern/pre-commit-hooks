# Git hooks, run by prek (https://prek.j178.dev), a faster drop-in for
# pre-commit. `prek install` sets up every hook type listed below, and CI runs
# all of them with `prek run --all-files`. Remote hooks are frozen to a commit
# SHA with the tag in a comment (`prek autoupdate --freeze`).
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # Built into prek: no download, no network.
  - repo: builtin
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]

  # Conventional Commits check on the commit message. The release job picks
  # each version from these (README, Releases), so a bad type ships nothing.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8 # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # GitHub Actions security audit of the workflows. Offline unless GH_TOKEN is
  # set, as in CI, which turns on the online audits.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: d25b2b1dc80689fb633f21f6978bba69871181d3 # frozen: v1.31.0
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      # golangci-lint through the Taskfile (.golangci.yml), built with the
      # go.mod toolchain: its upstream hook builds and runs it with whatever Go
      # is installed, which fails once that is older than go.mod. Formatting is
      # gofumpt and goimports.
      - id: golangci-lint
        name: golangci-lint
        entry: task lint
        language: system
        files: (\.go|(^|/)go\.(mod|sum)|(^|/)\.golangci\.yml)$
        pass_filenames: false
      - id: golangci-lint-fmt
        name: golangci-lint fmt
        entry: task fmt-check
        language: system
        types: [go]
        pass_filenames: false
      # This repo's own hooks, built from the working tree, run on its own
      # workflows: the code being changed checks itself before it is released.
      - id: no-latest-runners
        name: no-latest-runners (this checkout)
        entry: go run ./cmd/no-latest-runners
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      - id: require-timeouts
        name: require-timeouts (this checkout)
        entry: go run ./cmd/require-timeouts
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      # The manifest is what every consuming repo installs from, so a bad
      # entry or language breaks them all.
      - id: validate-manifest
        name: validate .pre-commit-hooks.yaml
        entry: prek validate-manifest
        language: system
        files: ^\.pre-commit-hooks\.yaml$
      # The Go checks run through the Taskfile, so tool versions and the
      # go.mod toolchain (GOTOOLCHAIN) stay pinned in one place.
      - id: go-test
        name: go test with coverage thresholds
        entry: task cover
        language: system
        types: [go]
        pass_filenames: false
      # Go files too: adding or dropping an import can leave go.mod untidy.
      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy -diff
        language: system
        files: (\.go|(^|/)go\.(mod|sum))$
        pass_filenames: false
      # Both judge the dependencies (govulncheck also the standard library of
      # the go.mod toolchain, and only what the code reaches).
      - id: govulncheck
        name: govulncheck
        entry: task vuln
        language: system
        files: (\.go|(^|/)go\.(mod|sum))$
        pass_filenames: false
      - id: go-licenses
        name: go-licenses
        entry: task licenses
        language: system
        files: (^|/)go\.(mod|sum)$
        pass_filenames: false
