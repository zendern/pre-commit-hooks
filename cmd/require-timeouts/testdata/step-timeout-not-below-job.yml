jobs:
  a:
    timeout-minutes: 30
    steps:
      - name: Build
        run: make
        timeout-minutes: 20
      - name: Test
        run: make test
        timeout-minutes: 30
      - name: Soak
        run: make soak
        timeout-minutes: 45
      - name: Lint
        run: make lint
        timeout-minutes: ${{ inputs.lint-timeout }}
